[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meldq"
version = "0.1.0"
description = "Synthetic food-security & livelihoods MEL data-quality lab with seeded errors and an answer key"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
meldq = "meldq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
